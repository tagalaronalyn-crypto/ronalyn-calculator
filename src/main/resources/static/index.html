<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronalyn Tagala - Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:linear-gradient(135deg,#ffe4ec 0%,#ffc2d6 50%,#ffb3c6 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'🌸';position:absolute;top:8%;left:12%;font-size:40px;opacity:0.4;animation:float1 5s ease-in-out infinite}
body::after{content:'🌺';position:absolute;bottom:10%;right:14%;font-size:36px;opacity:0.4;animation:float2 6s ease-in-out infinite}
.flower1{position:absolute;top:15%;right:18%;font-size:28px;opacity:0.3;animation:float1 4s ease-in-out infinite}
.flower2{position:absolute;bottom:18%;left:16%;font-size:32px;opacity:0.3;animation:float2 5s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(5deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-5deg)}}
.calculator{background:rgba(255,255,255,0.92);width:100%;max-width:340px;border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(236,72,153,0.15);border:2px solid #fbcfe8;position:relative;z-index:2;backdrop-filter:blur(10px)}
h1{text-align:center;color:#ec4899;font-size:22px;font-weight:800;margin-bottom:18px;letter-spacing:0.5px;text-shadow:0 2px 0 #ffe4ec}
h1 span{font-size:18px}
.display{background:linear-gradient(135deg,#fff1f7,#ffe4ec);border:2px solid #f9a8d4;border-radius:14px;padding:18px;text-align:right;min-height:80px;margin-bottom:16px;box-shadow:inset 0 2px 8px rgba(236,72,153,0.08)}
#prev{color:#f472b6;font-size:13px;min-height:16px;word-break:break-all}
#curr{color:#9d174d;font-size:36px;font-weight:800;word-break:break-all}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
button{height:60px;border:none;border-radius:14px;font-size:19px;font-weight:700;cursor:pointer;transition:all 0.15s ease;box-shadow:0 3px 0 rgba(0,0,0,0.08)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.08)}
.num{background:white;color:#831843;border:2px solid #fde2e8}
.num:hover{background:#fff1f7}
.op{background:linear-gradient(135deg,#f472b6,#ec4899);color:white;box-shadow:0 3px 0 #db2777}
.func{background:#fbcfe8;color:#9d174d;box-shadow:0 3px 0 #f9a8d4}
.eq{background:linear-gradient(135deg,#ec4899,#be185d);color:white;box-shadow:0 3px 0 #9d174d}
</style>
</head>
<body>
<div class="flower1">🌼</div>
<div class="flower2">🌷</div>
<div class="calculator">
<h1><span>🌸</span> Ronalyn Tagala <span>🌸</span></h1>
<div class="display"><div id="prev"></div><div id="curr">0</div></div>
<div class="buttons">
<button class="func" onclick="clearAll()">C</button>
<button class="func" onclick="toggleSign()">+/-</button>
<button class="func" onclick="percent()">%</button>
<button class="op" onclick="inputOp('/')">÷</button>
<button class="num" onclick="inputNum('7')">7</button>
<button class="num" onclick="inputNum('8')">8</button>
<button class="num" onclick="inputNum('9')">9</button>
<button class="op" onclick="inputOp('*')">×</button>
<button class="num" onclick="inputNum('4')">4</button>
<button class="num" onclick="inputNum('5')">5</button>
<button class="num" onclick="inputNum('6')">6</button>
<button class="op" onclick="inputOp('-')">−</button>
<button class="num" onclick="inputNum('1')">1</button>
<button class="num" onclick="inputNum('2')">2</button>
<button class="num" onclick="inputNum('3')">3</button>
<button class="op" onclick="inputOp('+')">+</button>
<button class="num" style="grid-column:span 2" onclick="inputNum('0')">0</button>
<button class="num" onclick="inputNum('.')">.</button>
<button class="eq" onclick="calculate()">=</button>
</div>
</div>
<script>
let curr='0',prev='',op=null,reset=false;
const currEl=document.getElementById('curr'),prevEl=document.getElementById('prev');
function update(){currEl.textContent=curr;prevEl.textContent=prev}
function inputNum(n){if(reset){curr=n==='.'?'0.':n;reset=false}else{if(n==='.'&&curr.includes('.'))return;if(curr==='0'&&n!=='.')curr=n;else curr+=n;}update()}
function inputOp(o){if(op&&!reset)calculate();prev=curr+' '+o;op=o;reset=true;update()}
function calculate(){if(!op||reset)return;let a=parseFloat(prev),b=parseFloat(curr),r=0;switch(op){case '+':r=a+b;break;case '-':r=a-b;break;case '*':r=a*b;break;case '/':if(b===0){curr="Can't ÷ by 0 💔";prev='';op=null;update();return}r=a/b;break;case '%':r=a%b;break}curr=Number.isInteger(r)?r.toString():parseFloat(r.toFixed(8)).toString();prev='';op=null;reset=true;update()}
function clearAll(){curr='0';prev='';op=null;update()}
function toggleSign(){if(curr==='0')return;curr=curr.startsWith('-')?curr.slice(1):'-'+curr;update()}
function percent(){curr=(parseFloat(curr)/100).toString();update()}
</script>
</body>
</html>
